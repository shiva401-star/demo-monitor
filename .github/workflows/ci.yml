name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy only — never real secrets or host credentials in CI
      SECRET_KEY: ci-dummy-secret-not-for-production
      DEMO_PASSWORD: ci-demo-pass
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q app tests

      - name: Run tests
        run: pytest
        # No DB/credential artifacts uploaded; tests use temp DB + fixtures only
